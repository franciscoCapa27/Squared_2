name: Deploy Web Build to itch.io

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  GODOT_PROJECT_DIR: squared-2
  GODOT_VERSION: 4.6.1
  GODOT_EXPORT_PRESET: Web

  ITCH_USERNAME: mixedtoast
  ITCH_GAME: squared2

jobs:
  export-and-deploy:
    name: Export and deploy Web build
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y wget unzip libfontconfig1

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          wget -O /tmp/godot_export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/godot_export_templates.tpz -d /tmp/godot_export_templates
          cp /tmp/godot_export_templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Show repo structure
        run: |
          pwd
          ls -la
          ls -la "$GODOT_PROJECT_DIR"

      - name: Show Godot version
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: godot --version

      - name: Verify source used by CI
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: |
          echo "Commit: ${GITHUB_SHA}"
          echo "Checking story strings in scripts..."
          grep -R "There is only one square\|CI DEPLOY TEST\|There is a square" scripts || true

      - name: Clean previous CI build output
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: |
          rm -rf build/web
          mkdir -p build/web

      - name: Import project
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: godot --headless --import --quit

      - name: Export Web build with cache-busted filenames
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: |
          SHA_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          EXPORT_HTML="build/web/squared2_${SHA_SHORT}.html"

          echo "Exporting to: ${EXPORT_HTML}"
          godot --headless --export-release "$GODOT_EXPORT_PRESET" "$EXPORT_HTML"

          echo "Renaming exported HTML entrypoint to index.html for itch.io"
          mv "$EXPORT_HTML" build/web/index.html

      - name: Write build info
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: |
          echo "commit=${GITHUB_SHA}" > build/web/build_info.txt
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build/web/build_info.txt
          echo "godot_version=${GODOT_VERSION}" >> build/web/build_info.txt
          cat build/web/build_info.txt

      - name: Verify build output
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: |
          SHA_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"  
          test -f build/web/index.html
          test -f build/web/build_info.txt
          ls -la build/web
          echo "Checking exported HTML references:"
          grep -n "squared2_${SHA_SHORT}" build/web/index.html || true

      - name: Setup butler
        uses: remarkablegames/setup-butler@v1

      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push "$GODOT_PROJECT_DIR/build/web" "$ITCH_USERNAME/$ITCH_GAME:web"