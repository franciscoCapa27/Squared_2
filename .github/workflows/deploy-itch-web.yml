name: Deploy Web Build to itch.io

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  GODOT_PROJECT_DIR: squared-2
  GODOT_EXPORT_PRESET: Web
  EXPORT_PATH: build/web/index.html

  ITCH_USERNAME: mixedtoast
  ITCH_GAME: squared2

jobs:
  export-and-deploy:
    name: Export and deploy Web build
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          pwd
          ls -la
          ls -la "$GODOT_PROJECT_DIR"

      - name: Show Godot version
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: godot --version

      - name: Create export directory
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: mkdir -p build/web

      - name: Import project
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: godot --headless --import --quit

      - name: Export Web build
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: godot --headless --export-release "$GODOT_EXPORT_PRESET" "$EXPORT_PATH"

      - name: Verify build output
        working-directory: ${{ env.GODOT_PROJECT_DIR }}
        run: |
          test -f build/web/index.html
          ls -la build/web

      - name: Setup butler
        uses: remarkablegames/setup-butler@v1

      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push "$GODOT_PROJECT_DIR/build/web" "$ITCH_USERNAME/$ITCH_GAME:web"